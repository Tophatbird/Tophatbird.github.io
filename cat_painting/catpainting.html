<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>fCC Car Painting</title>
    <link rel="stylesheet" href="./kittystyles.css">
</head>
<body>
    <main>
      <div class="car-head">
        <div class="car-ears">
          <div class="car-left-ear">
            <div class="car-left-inner-ear"></div>
          </div>
          <div class="car-right-ear">
            <div class="car-right-inner-ear"></div>
          </div>
        </div>

        <div class="car-eyes">
          <div class="car-left-eye">
            <div class="car-left-inner-eye"></div>
          </div>
          <div class="car-right-eye">
            <div class="car-right-inner-eye"></div>
          </div>
        </div>
        
        <div class="car-nose"></div>

        <div class="car-mouth">
          <div class="car-mouth-line-left"></div>
          <div class="car-mouth-line-right"></div>
        </div>

        <div class="car-whiskers">
          <div class="car-whiskers-left">
            <div class="car-whisker-left-top"></div>
            <div class="car-whisker-left-middle"></div>
            <div class="car-whisker-left-bottom"></div>
          </div>
          <div class="car-whiskers-right">
            <div class="car-whisker-right-top"></div>
            <div class="car-whisker-right-middle"></div>
            <div class="car-whisker-right-bottom"></div>
          </div>
        </div>

      </div>
    </main>
</body>
</html>
